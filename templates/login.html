{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="login-box">
  <h1>登录</h1>
  <form method="post" class="form">
    <label>账号
      <input name="username" required autofocus placeholder="学号 / 工号 / admin">
    </label>
    <label>密码
      <input type="password" name="password" required>
    </label>
    <button class="primary" type="submit">登录</button>
  </form>
  <p class="hint">
    演示账号：<br>
    管理员 admin &nbsp;|&nbsp; 教师 teacher1 &nbsp;|&nbsp; 学生 2023001<br>
    密码都是 123456
  </p>
</div>
{% endblock %}
